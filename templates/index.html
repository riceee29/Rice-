<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Pro : Ultimate Kkutu Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

    <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-gradient-to-tr from-amber-500 to-red-500 p-3 rounded-xl shadow-lg">
                    <i class="fa-solid fa-bolt text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
                        RICE PRO AUTOMATION
                    </h1>
                    <p class="text-xs text-slate-400">KKUTU AUTOMATION CONTROL ENGINE</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">엔진 상태</span>
                    <span id="status-text" class="text-sm font-semibold text-red-400">정지됨</span>
                </div>
                <button id="btn-toggle" onclick="toggleBot()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all duration-200 shadow-lg shadow-emerald-950 flex items-center gap-2">
                    <i class="fa-solid fa-play"></i>
                    <span>엔진 시작</span>
                </button>
            </div>
        </header>

        <!-- Main Content Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Panel: Settings & Add Words -->
            <div class="space-y-6">
                
                <!-- Quick Settings -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                    <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-amber-500"></i> 실시간 환경 설정
                    </h2>
                    
                    <div>
                        <div class="flex justify-between text-sm mb-2">
                            <span class="text-slate-400">응답 딜레이</span>
                            <span id="delay-val" class="font-mono text-amber-400 font-bold">0.4초</span>
                        </div>
                        <input type="range" id="delay-range" min="0.05" max="2.0" step="0.05" value="0.4" oninput="updateDelay(this.value)" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500">
                        <span class="text-[11px] text-slate-500 mt-1 block">* 0.05초 미만 설정은 탐지 위험이 있습니다.</span>
                    </div>
                </div>

                <!-- Manual Word Register -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                    <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-plus text-emerald-500"></i> 수동 단어 등록
                    </h2>
                    <textarea id="input-new-words" rows="4" placeholder="추가할 단어를 입력하세요 (공백/줄바꿈으로 구분)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 transition-colors resize-none"></textarea>
                    <button onclick="addWords()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 font-semibold rounded-xl border border-emerald-500/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-file-import"></i> 단어 추가하기
                    </button>
                </div>

            </div>

            <!-- Middle/Right Panel: Dictionary Explorer & Console Logs -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Dictionary Search & Viewer -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-book text-cyan-500"></i> 단어장 라이브러리
                            <span id="dict-total-count" class="text-xs bg-slate-800 text-cyan-400 px-2.5 py-1 rounded-full border border-cyan-500/20">0개</span>
                        </h2>
                        <div class="relative">
                            <input type="text" id="dict-search" oninput="searchWords()" placeholder="단어 검색..." class="bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-1.5 text-sm focus:outline-none focus:border-cyan-500 w-full sm:w-48">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
                        </div>
                    </div>

                    <!-- Words Grid View -->
                    <div id="words-container" class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 h-48 overflow-y-auto flex flex-wrap gap-2 content-start">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <!-- Console Output Log -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-3">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-terminal text-purple-500"></i> 라이브 실행 콘솔
                        </h2>
                        <button onclick="clearLogs()" class="text-xs text-slate-500 hover:text-slate-300">로그 지우기</button>
                    </div>
                    
                    <div id="log-container" class="bg-slate-950 border border-slate-800 rounded-xl p-4 h-56 overflow-y-auto font-mono text-xs space-y-1.5">
                        <div class="text-slate-500">[System] 컨트롤 판넬이 준비되었습니다.</div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Front Control Script -->
    <script>
        const socket = io();
        let isRunning = false;

        // Socket Events
        socket.on('log', (data) => {
            const container = document.getElementById('log-container');
            const item = document.createElement('div');
            
            let color = 'text-slate-300';
            if(data.type === 'success') color = 'text-emerald-400';
            if(data.type === 'warn') color = 'text-amber-400';
            if(data.type === 'error') color = 'text-rose-400';

            const timeStr = new Date().toLocaleTimeString();
            item.className = `${color} leading-relaxed`;
            item.innerHTML = `<span class="text-slate-600">[${timeStr}]</span> ${data.msg}`;
            
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('status_change', (data) => {
            isRunning = data.running;
            const btn = document.getElementById('btn-toggle');
            const statusText = document.getElementById('status-text');

            if(isRunning) {
                statusText.innerText = "가동 중";
                statusText.className = "text-sm font-semibold text-emerald-400";
                btn.className = "px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl transition-all duration-200 shadow-lg shadow-rose-950 flex items-center gap-2";
                btn.innerHTML = `<i class="fa-solid fa-square"></i><span>엔진 정지</span>`;
            } else {
                statusText.innerText = "정지됨";
                statusText.className = "text-sm font-semibold text-red-400";
                btn.className = "px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all duration-200 shadow-lg shadow-emerald-950 flex items-center gap-2";
                btn.innerHTML = `<i class="fa-solid fa-play"></i><span>엔진 시작</span>`;
            }
        });

        socket.on('dict_updated', (data) => {
            fetchWords();
        });

        // Functions
        function toggleBot() {
            socket.emit('toggle_bot', { run: !isRunning });
        }

        function updateDelay(val) {
            document.getElementById('delay-val').innerText = `${val}초`;
            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'json' },
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ delay: parseFloat(val) })
            });
        }

        function addWords() {
            const textarea = document.getElementById('input-new-words');
            const words = textarea.value.trim();
            if(!words) return;

            fetch('/api/words/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ words: words })
            })
            .then(res => res.json())
            .then(data => {
                textarea.value = '';
                fetchWords();
            });
        }

        function fetchWords() {
            const query = document.getElementById('dict-search').value;
            fetch(`/api/words?search=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('dict-total-count').innerText = `${data.count}개`;
                const container = document.getElementById('words-container');
                container.innerHTML = '';
                
                data.words.forEach(w => {
                    const tag = document.createElement('span');
                    tag.className = "bg-slate-900 text-slate-300 border border-slate-800 text-xs px-2.5 py-1 rounded-lg hover:border-slate-700 transition-colors";
                    tag.innerText = w;
                    container.appendChild(tag);
                });
            });
        }

        let searchTimer;
        function searchWords() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(fetchWords, 200);
        }

        function clearLogs() {
            document.getElementById('log-container').innerHTML = '';
        }

        // Initialize
        fetchWords();
    </script>
</body>
</html>
